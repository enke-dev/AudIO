name: Release

# Every push to main: derive the next semver from Conventional Commits since the last tag,
# build the disk image, then tag and publish the GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time – versions are derived from the latest tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon runner on macOS 27 with Xcode 27: Icon.icon needs Xcode 26+, the status
    # item's system-managed panel session (menu bar stays revealed, icon highlighted) the
    # macOS 27 SDK. Public preview – switch to `macos-27` once that label is available.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags for the version calculation

      - name: Determine version
        id: version
        run: |
          version="$(scripts/version.sh build/release-notes.md)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: ${version:-none (no new commits)}"

      - name: Set app version
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          plutil -replace CFBundleShortVersionString -string "$VERSION" Resources/Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" Resources/Info.plist

      # Self-signed certificate from scripts/signing.sh: a stable signature keeps users'
      # audio capture and microphone permissions across updates. Ad-hoc without it.
      - name: Import signing certificate
        if: steps.version.outputs.version != ''
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "::warning::No signing certificate secret – building ad-hoc"; exit 0; fi
          p12="$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -base64 24)"
          echo "$P12" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Sign by SHA-1 hash: unambiguous, and independent of the certificate's trust.
          hash="$(/usr/bin/openssl pkcs12 -in "$p12" -nokeys -passin env:P12_PASSWORD \
            | /usr/bin/openssl x509 -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
          rm "$p12"
          echo "CODESIGN_IDENTITY=$hash" >> "$GITHUB_ENV"

      - name: Build disk image
        if: steps.version.outputs.version != ''
        run: scripts/release.sh

      - name: Tag and publish release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" build/AudIO-*.dmg \
            --target "$GITHUB_SHA" \
            --title "AudIO $VERSION" \
            --notes-file build/release-notes.md
